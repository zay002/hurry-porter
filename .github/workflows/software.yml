name: Software checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ros2:
    runs-on: ubuntu-24.04
    container:
      image: ros:jazzy-ros-base

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install test tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            python3-colcon-common-extensions \
            python3-pytest

      - name: Python unit tests
        run: python3 -m pytest -q

      - name: Build ROS 2 workspace
        run: |
          . /opt/ros/jazzy/setup.sh
          colcon build --event-handlers console_direct+

      - name: Run ROS 2 tests
        run: |
          . /opt/ros/jazzy/setup.sh
          colcon test --event-handlers console_direct+

      - name: CLI smoke test
        run: |
          . /opt/ros/jazzy/setup.sh
          . install/setup.sh
          hurry --help
          hurry init --print
          hurry setup usbipd --json || true
          hurry setup serial --json
          hurry serial send --port /dev/null --hex "01 02" --dry-run --json
          hurry gamepad status --json
          hurry waveshare-can-a send --port /dev/null --dry-run --json --id 0x123 --data "11 22"
          hurry waveshare-can-a decode --json --hex "aa c2 03 01 11 22 55"
          hurry scan --json
          hurry watch --once --json --no-attach
          hurry ros export --format json
          hurry ros export --format params
          hurry ros export --format launch-file
